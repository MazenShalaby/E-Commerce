{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Order Pay
{% endblock title %}

{% block content %}
<div class="container justify-content-center">
    <h1>Order Payment</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form|crispy}}
        <input type="submit" value="Pay" class="btn btn-success">
    </form>
</div>
{% endblock content %}
