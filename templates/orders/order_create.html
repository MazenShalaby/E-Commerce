{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Create Order
{% endblock title %}

{% block content %}
<br>
<h1 class="text-center">Checkout</h1>
<div class="container justify-content-center">
    <form action="" method="post">
        {% csrf_token %}
        {{form|crispy}}
        <input type="submit" value="Place Order" class="btn btn-primary">
    </form>
</div>
<br>
{% endblock content %}
