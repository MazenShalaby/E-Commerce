{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Order Payment
{% endblock title %}

{% block content %}
<div class="container justify-content-center">
    <h1>Order Payment</h1>
    <!-- Set up a container element for the button -->
    <div id="paypal-button-container"></div>
    <script
        src="https://www.paypal.com/sdk/js?client-id=AW9V8kqdEdiq_WAFR8wxyD10TRUQ3fV80UuOFI7WKIDTtg9M1q9QCTyq3oXNHqHqvtCrfSp0hzsTxFiT&currency=USD">
    </script>

    <script>
        const total_price = "{{ cart.get_sub_total }}";

        paypal.Buttons({

            createOrder: function (data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: total_price
                        }
                    }]
                });
            },

            onApprove: function (data, actions) {
                return actions.order.capture().then(function (orderData) {

                    console.log(
                        "Capture result",
                        orderData,
                        JSON.stringify(orderData, null, 2)
                    );

                    window.location.href =
                        "{% url 'success-payment' order_id=order.id %}";
                });
            }

        }).render("#paypal-button-container");
    </script>
</div>
{% endblock content %}
